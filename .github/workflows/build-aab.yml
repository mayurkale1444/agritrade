name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: agritrade
      KEY_PASSWORD: agritrade2026
      STORE_PASSWORD: agritrade2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create release keystore
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/agritrade-release.keystore \
            -alias agritrade \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass agritrade2026 \
            -keypass agritrade2026 \
            -dname "CN=AgriTrade, OU=Mobile, O=AgriTrade, L=Pune, S=Maharashtra, C=IN"

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Signed Release AAB
        working-directory: ./android
        env:
          KEY_ALIAS: agritrade
          KEY_PASSWORD: agritrade2026
          STORE_PASSWORD: agritrade2026
          KEYSTORE_PASSWORD: agritrade2026
          RELEASE_STORE_PASSWORD: agritrade2026
          RELEASE_KEY_PASSWORD: agritrade2026
          MYAPP_RELEASE_STORE_PASSWORD: agritrade2026
          MYAPP_RELEASE_KEY_PASSWORD: agritrade2026
          MYAPP_UPLOAD_STORE_PASSWORD: agritrade2026
          MYAPP_UPLOAD_KEY_PASSWORD: agritrade2026
        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file=../android/keystore/agritrade-release.keystore -Pandroid.injected.signing.store.password=agritrade2026 -Pandroid.injected.signing.key.alias=agritrade -Pandroid.injected.signing.key.password=agritrade2026

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-backup
          path: android/keystore/agritrade-release.keystore
