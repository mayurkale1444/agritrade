name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: agritrade
      KEY_PASSWORD: agritrade2026
      STORE_PASSWORD: agritrade2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore from Secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore android/app
          python3 -c '
          import base64, os
          raw = os.environ.get("KEYSTORE_B64", "")
          cleaned = "".join([line.strip() for line in raw.splitlines() if not line.startswith("-----")])
          with open("android/keystore/agritrade-release.keystore", "wb") as f:
              f.write(base64.b64decode(cleaned))
          '
          cp android/keystore/agritrade-release.keystore android/app/agritrade-release.keystore
      - name: Ensure Gradle Wrapper exists
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Signed Release AAB
        working-directory: ./android
        env:
          KEY_ALIAS: agritrade
          KEY_PASSWORD: agritrade2026
          STORE_PASSWORD: agritrade2026
          KEYSTORE_PASSWORD: agritrade2026
          RELEASE_STORE_PASSWORD: agritrade2026
          RELEASE_KEY_PASSWORD: agritrade2026
          MYAPP_RELEASE_STORE_PASSWORD: agritrade2026
          MYAPP_RELEASE_KEY_PASSWORD: agritrade2026
          KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/agritrade-release.keystore
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/keystore/agritrade-release.keystore
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v10
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
