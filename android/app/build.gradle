plugins {
    id 'com.android.application'
}

android {
    namespace 'in.agritrade.app'
    compileSdk 36

    defaultConfig {
        applicationId "in.agritrade.app"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // Configurable via Gradle properties or CI environment variables
            if (project.hasProperty('AGRITRADE_RELEASE_STORE_FILE')) {
                storeFile file(AGRITRADE_RELEASE_STORE_FILE)
                storePassword AGRITRADE_RELEASE_STORE_PASSWORD
                keyAlias AGRITRADE_RELEASE_KEY_ALIAS
                keyPassword AGRITRADE_RELEASE_KEY_PASSWORD
            } else {
                // Fallback signing config for automated local release assembly
                storeFile file("${rootDir}/keystore/agritrade-release.keystore")
                storePassword "agritrade2026"
                keyAlias "agritrade"
                keyPassword "agritrade2026"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    bundle {
        language {
            enableSplit = false // Retain all Marathi & English strings
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
