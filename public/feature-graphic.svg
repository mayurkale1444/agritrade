<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid agricultural deep green background -->
  <rect width="1024" height="500" fill="#14532D"/>
  
  <!-- Subtle agricultural topography contour lines -->
  <path d="M0 380 Q256 310 512 360 T1024 330 L1024 500 L0 500 Z" fill="#166534" opacity="0.7"/>
  <path d="M0 430 Q320 370 640 410 T1024 390 L1024 500 L0 500 Z" fill="#15803D" opacity="0.5"/>

  <!-- Left: Official Emblem in Rounded Container -->
  <g transform="translate(80, 110)">
    <rect width="160" height="160" rx="36" fill="#166534" stroke="#4ADE80" stroke-width="3" stroke-opacity="0.4"/>
    <g transform="translate(20, 20) scale(1.2)">
      <path d="M47 84C47 84 20 74 18 45C16 26 31 16 34 16C36 28 39 42 47 52V84Z" fill="#FFFFFF"/>
      <path d="M53 84V50C62 40 70 28 82 16C82 16 84 34 76 52C70 66 53 84 53 84Z" fill="#4ADE80"/>
      <path d="M50 36L42 46H48V72H52V46H58L50 36Z" fill="#86EFAC"/>
      <rect x="36" y="86" width="28" height="4" rx="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography: AgriTrade Wordmark -->
  <text x="275" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">Agri<tspan fill="#4ADE80">Trade</tspan></text>
  <text x="278" y="240" fill="#D1FAE5" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">Know Before You Sell • अधिकृत कृषी बाजारभाव</text>
  
  <!-- 3 Key Functional Pillars -->
  <g transform="translate(278, 280)">
    <rect width="210" height="42" rx="12" fill="#166534" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="105" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AGMARKNET Certified</text>
  </g>
  <g transform="translate(504, 280)">
    <rect width="200" height="42" rx="12" fill="#166534" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="100" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Trader Field Rates</text>
  </g>
  <g transform="translate(720, 280)">
    <rect width="190" height="42" rx="12" fill="#166534" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="95" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Profit Calculator</text>
  </g>
